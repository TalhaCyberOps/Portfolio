<text x="48" y="60" class="m" font-size="12.5" fill="#2ee6c5" letter-spacing="2.2">01 / ABOUT</text>
<line x1="158" y1="56" x2="214" y2="56" stroke="#2ee6c5" stroke-opacity=".5"/>
<text x="48" y="112" class="s" font-size="38" fill="#e7edf6" font-weight="700">Cybersecurity first.</text>
<text x="48" y="156" class="s" font-size="38" fill="#8a97ab" font-weight="700">AI is where I apply it.</text>
<text x="48" y="204.0" class="s" font-size="16.5" fill="#b9c4d3">I hold a BS in Cyber Security from Air University, Islamabad, and</text>
<text x="48" y="229.6" class="s" font-size="16.5" fill="#b9c4d3">I'm completing an MS in Cyber Security there while working as an</text>
<text x="48" y="255.2" class="s" font-size="16.5" fill="#b9c4d3">AI Engineer. I harden LLM applications against prompt injection,</text>
<text x="48" y="280.7" class="s" font-size="16.5" fill="#b9c4d3">build detection pipelines where AI interprets findings but never</text>
<text x="48" y="306.3" class="s" font-size="16.5" fill="#b9c4d3">decides them, and secure edge networks with cryptography and</text>
<text x="48" y="331.9" class="s" font-size="16.5" fill="#b9c4d3">on-device intrusion detection.</text>
