<text x="32" y="50" class="m" font-size="12" fill="#2ee6c5" letter-spacing="1.5">RESEARCH · FINAL-YEAR PROJECT</text>
<text x="32" y="90" class="s" font-size="26" fill="#e7edf6" font-weight="700">AEGIS-LN</text>
<text x="32" y="122.0" class="s" font-size="15" fill="#b9c4d3">Hardware-isolated LoRa mesh with a 3-stage edge-AI firewall. Basis</text>
<text x="32" y="145.2" class="s" font-size="15" fill="#b9c4d3">of my IEEE IBCAST 2026 paper.</text>
<rect x="32" y="187" width="6" height="6" rx="1.5" fill="#2ee6c5" fill-opacity=".8"/>
<text x="50" y="196.0" class="s" font-size="14.5" fill="#aab6c6">Ephemeral ECDH, AES-128 Encrypt-then-MAC, AOMDV routing</text>
<rect x="32" y="215.475" width="6" height="6" rx="1.5" fill="#2ee6c5" fill-opacity=".8"/>
<text x="50" y="224.5" class="s" font-size="14.5" fill="#aab6c6">&gt;96% attack traffic dropped, &lt;2% false positives</text>
<rect x="32" y="243.95" width="6" height="6" rx="1.5" fill="#2ee6c5" fill-opacity=".8"/>
<text x="50" y="252.9" class="s" font-size="14.5" fill="#aab6c6">7–15 ms firewall latency, &lt;2 ms crypto per packet</text>
